mode: mock            # mock | shadow | live (live is rejected unless fully armed)
quote_currency: USDT
host: api.wallex.ir
universe:
  top_n: 12
  max_spread_bps: 15
  max_slippage_bps: 20
  min_depth_multiple: 5
  max_data_age_s: 30
risk:
  risk_per_trade_pct: "1.0"
  max_position_pct: "25"
  max_exposure_pct: "60"
  max_open_positions: 3
  max_order_value: "1000"
  daily_loss_soft_pct: "4"
  daily_loss_hard_pct: "6"
  drawdown_soft_pct: "8"
  drawdown_hard_pct: "12"
  consecutive_loss_cooldown: 3
  min_notional: "5"          # placeholder, unverified on Wallex
fees:
  # 0.002 = the flat 0.2 % for USDT pairs documented on a PUBLIC, UNDATED Wallex help page
  # (wallex.ir/help/knowledge-base/commissions-calculate/; the API docs' fee example is also
  # 0.002/0.002), see docs/COSTS.md. Real rates are tier/volume dependent and our account's rate
  # is unverified: read GET /v1/account/fee (`python -m wallexbot doctor`) before trusting it.
  # (Before 2026-10 the default was 0.0035, an unverified planning assumption.)
  taker_rate: "0.002"        # documented public USDT-pair rate; account rate unverified
  maker_rate: "0.002"
