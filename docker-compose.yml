# wallexbot, SHADOW mode only (simulated fills on the public order book; no orders are ever sent).
#
#   docker compose up -d --build                     # the shadow bot (its guardian runs in-process)
#   docker compose --profile recorder up -d          # also the market-data recorder
#
# There is no separate guardian service: the bot runs the guardian in-process against its own shadow
# broker (`--no-guardian` disables it). A separate guardian process only makes sense against a live
# exchange account, which this build does not have (docs/DEPLOY.md, "Guardian").
#
# Network: the only host the containers need is api.wallex.ir (HTTPS, public GET). Compose cannot
# filter egress by host; restrict it at the host firewall if you need that. No ports are published.
# Secrets: shadow mode needs none. `.env` is optional and read by name only (see .env.example);
# never put WALLEX_API_KEY_TRADE or WALLEX_ARM_LIVE in it.

x-common: &common
  image: wallexbot:shadow
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=16m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  env_file:
    - path: .env
      required: false
  volumes:
    - wallex-data:/data
  pids_limit: 128
  stop_grace_period: 60s        # the bot finishes its current tick on SIGTERM
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  bot:
    <<: *common
    build: .                     # the one image for both services
    container_name: wallexbot-bot
    command: ["python", "-m", "wallexbot", "bot", "--db", "/data/bot.db", "--mode", "shadow",
              "--balance", "1000", "--interval-s", "12"]
    mem_limit: 768m
    cpus: 1.0

  # Optional public-data recorder: depth + trades to /data/recorder/*.jsonl. Start with --profile recorder.
  recorder:
    <<: *common
    container_name: wallexbot-recorder
    profiles: ["recorder"]
    command: ["python", "/app/deploy/run_recorder.py", "--out-dir", "/data/recorder", "--interval-s", "15"]
    healthcheck:
      test: ["CMD", "python", "/app/deploy/healthcheck.py", "--recorder-dir", "/data/recorder"]
      interval: 60s
      timeout: 10s
      start_period: 120s
      retries: 3
    mem_limit: 256m
    cpus: 0.5

volumes:
  wallex-data:
